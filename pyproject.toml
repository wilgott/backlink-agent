[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backlink-agent"
version = "0.1.0"
description = "Allowlist-gated automation for registering a product on startup directories, driven by AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "click",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
backlink-agent = "backlink_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backlink_agent"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
